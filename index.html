<!DOCTYPE html>
<html>
  <head>
    <title>AI ChatBot</title>
    <style>
      body {
          font-family: sans-serif;
          max-width: 600px;
          margin: 40px auto;
      }
      #chatbox {
          border: 1px solid #ccc;
          height:400px;
          overflow-y: auto;
          padding: 10px;
          margin-bottom: 10px;
      }
      .user {
          color: blue; margin 8px 0;
      }
      .ai {
          color: green; margin 8px 0;
      }
      input {
          width: 80%;
          padding: 8px;
      }
      button {
          padding: 8px 16px;
      }
    </style>
  </head>
  <body>
    
    <h2>AI Chatbot</h2>

    <div id="chatbox"> </div>

    <input type="text" id="userInput" placeholder="Type a message..."/>
    <button onclick="sendMessage()">Send</button>

    <script>

      let conversations = [];

      async function sendMessage() {
          const input = document.getElementById("userInput");
          const message = input.value.trim();

          if(!message) {
              return;
          }

          conversations.push({"role": "user", content: message});
          showMessage("You", message, "user");
          input.value="";

          const response = await fetch("http://127.0.0.1:8000/chat", {
              method: "POST",
              headers: {
                  "Content-Type": "application/json"
              },
              body: JSON.stringify({ messages: conversations })
          });

          const chatbox = document.getElementById("chatbox");
          const aiMessageElement = document.createElement("div");
          aiMessageElement.className = "ai";
          chatbox.appendChild(aiMessageElement);

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullReply = "";

          while(true)
          {
              const { done,value} = await reader.read();
              if(done) break;

              const chunkText = decoder.decode(value);
              fullReply += chunkText;
              aiMessageElement.textContent = "AI: " + fullReply;
              chatbox.scrollTop = chatbox.scrollHeight;
              
          }

          conversations.push({"role": "assistant", content: fullReply });
      }

      function showMessage(sender, text, cssClass) {
          const chatbox = document.getElementById("chatbox");

          const messageElement = document.createElement("div");
          messageElement.className = cssClass;
          messageElement.textContent = sender + ": " + text;

          chatbox.appendChild(messageElement);

          // autoscroll to latest message
          chatbox.scrollTop = chatbox.scrollHeight;
      }
    </script>
    
    
  </body>
</html>
